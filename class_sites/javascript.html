<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Test</title>
</head>

<body>
    <img src="class_assets/cookie.png" alt="Cookie" width="400px" onclick="addScore()">
    <div id="scoreBox">0</div>
    <button onclick="buyMulti()" id="upgradeButton">Buy Upgrade (10)</button>
    <button onclick="buyAutoClick()" id="autoButton">Buy Auto Clicker (25)</button>

</body>
<script>
    var name = prompt("What is your name?");
    name = name.toLowerCase();
    if (name == "" || name == null) {
        document.write("Hello, Stranger!");

    } else {
        document.write("Hello, " + name + "!");
    }


    var score = 0;
    var multiplier = 1.0
    var autoClickAmmt = 0
    var scoreBox = document.getElementById("scoreBox");

    function addScore() {
        score = score + multiplier;
        scoreBox.innerHTML = score;
    }

    function buyMulti() {
        if (score >= (multiplier * 10)) {
            score = score - (multiplier * 10);
            multiplier = multiplier + 0.1;
            scoreBox.innerHTML = score;
            upgradeButton.innerHTML = "Buy Upgrade (" + (multiplier * 10) + ")";
            
        }
        else {
            alert("You don't have enough money.")
        }
    }

    function buyAutoClick() {

        if (autoClickAmmt == 0 && score >= 25) {
            score - 25
            autoClickAmmt = 1
            autoButton.innerHTML = "Buy Auto Clicker ("+ ((autoClickAmmt + 1)* 25) + ")";
            
            
            setInterval(
                () => {
                    score = score + autoClickAmmt;
                    scoreBox.innerHTML = score;
                    
                },
                1000
            )
        }
        else {
            if (score >= autoClickAmmt * 25) {
                score = score - (autoClickAmmt * 25)
                autoClickAmmt = autoClickAmmt + 1
                scoreBox.innerHTML = score;
                autoButton.innerHTML = "Buy Auto Clicker ("+ ((autoClickAmmt + 1)* 25) + ")";
                
                
                
            }
        }
    }

</script>

</html>
